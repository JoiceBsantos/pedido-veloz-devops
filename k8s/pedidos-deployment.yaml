apiVersion: apps/v1

kind: Deployment

metadata:
  name: pedidos-service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: pedidos-service

  template:
    metadata:
      labels:
        app: pedidos-service

    spec:
      containers:
        - name: pedidos-service

          image: pedidos-service:1.0.0

          ports:
            - containerPort: 3001

          env:
            - name: NODE_ENV
              value: production