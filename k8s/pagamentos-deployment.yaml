apiVersion: apps/v1

kind: Deployment

metadata:
  name: pagamentos-service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: pagamentos-service

  template:
    metadata:
      labels:
        app: pagamentos-service

    spec:
      containers:
        - name: pagamentos-service

          image: pagamentos-service:1.0.0

          ports:
            - containerPort: 3002

          env:
            - name: NODE_ENV
              value: production